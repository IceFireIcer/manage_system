name: labstock

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ManageSystem2026}
      MYSQL_DATABASE: manage_system
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    image: ghcr.io/icefireicer/labstock-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DEBUG: "false"
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-ManageSystem2026}@db:3306/manage_system?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-manage-system-default-jwt-secret-change-in-prod-0123456789abcdef}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "480"
      ADMIN_INIT_ACCOUNT: ${ADMIN_INIT_ACCOUNT:-}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      ADMIN_INIT_NAME: ${ADMIN_INIT_NAME:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      TZ: Asia/Shanghai
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/icefireicer/labstock-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4900}:80"

volumes:
  mysql_data: