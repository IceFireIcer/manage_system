name: labstock

services:
  backend:
    environment:
      APP_ENV: prod
      COOKIE_SECURE: "true"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}

  web:
    ports:
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro